# Edge reverse proxy for the gym tracker stack.
#
# This is the single container published outside the Docker network (see
# docker-compose.yml). It fronts two internal, unpublished services:
#   - frontend: the built React SPA, served by its own nginx
#   - backend:  the FastAPI app
#
# Point your router/Tailscale/whatever external access method at this
# container's published port.

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    # Simple gate for a small, fixed set of known users — HTTP Basic Auth.
    # Credentials live in .htpasswd (not committed to git). See README for
    # how to generate/update it. This protects everything below —
    # the UI, the API, and the docs — before it reaches any container.
    auth_basic "Iron Log";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # API traffic goes straight to FastAPI.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # $remote_user is set by auth_basic above — this lets the backend
        # know who authenticated, so the UI can default to their own tab.
        proxy_set_header X-Remote-User $remote_user;
    }

    # Interactive API docs, handy for debugging from outside the LAN too.
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Everything else is the React app.
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}