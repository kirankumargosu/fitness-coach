# Edge reverse proxy for the gym tracker stack.
#
# This is the single container published outside the Docker network (see
# docker-compose.yml). It fronts two internal, unpublished services:
#   - frontend: the built React SPA, served by its own nginx
#   - backend:  the FastAPI app
#
# Point your router/Tailscale/whatever external access method at this
# container's published port.

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    # No auth gate here anymore — the app itself handles login/register
    # and per-user permissions (see backend/app/auth.py). This nginx layer
    # is purely routing.

    # API traffic goes straight to FastAPI.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the React app.
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}