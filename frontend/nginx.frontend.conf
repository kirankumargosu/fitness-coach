server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing, so any path that isn't a real
    # static file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
